<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Suite 700 clean rendered leasing map</title>
  <desc id="desc">Rendered seventh floor office leasing map with room numbers and color coded rent bands.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <style>
      svg{background:#0b0d0d;font-family:Manrope,Avenir Next,Segoe UI,sans-serif}
      .floor{fill:#17130d;stroke:#f7d67c;stroke-opacity:.55;stroke-width:3;filter:url(#shadow)}
      .corridor{fill:#28241a;stroke:#f7d67c;stroke-opacity:.25;stroke-width:2}
      .core{fill:#101111;stroke:#fff;stroke-opacity:.12;stroke-width:2}
      .amenity{fill:#2c2318;stroke:#f7d67c;stroke-opacity:.32;stroke-width:2}
      .training{fill:#3d292c}.lounge{fill:#2d3429}.cowork{fill:#22313a}
      .amenity-label{fill:#f8efdf;fill-opacity:.72;font-size:18px;font-weight:900;letter-spacing:.08em;text-anchor:middle}
      .room rect{stroke:#fff;stroke-opacity:.3;stroke-width:2}
      .room text{text-anchor:middle;fill:#fffaf0;font-weight:900;pointer-events:none}
      .num{font-size:20px}.rent{font-size:12px}.sf{font-size:12px;fill-opacity:.82}
      .rent300 rect,.legend .rent300{fill:#0f857a}
      .rent399 rect,.legend .rent399{fill:#2f61b5}
      .rent499 rect,.legend .rent499{fill:#b26e15}
      .rent599 rect,.legend .rent599{fill:#8c4aa0}
      .rentcowork rect,.legend .rentcowork{fill:#3e8a50}
      .confirm rect,.legend .confirm{fill:#545b66}
      .off rect{fill:#282828}.off{opacity:.58}.cross{stroke:#fff1d2;stroke-width:4;stroke-linecap:round}
      .title{fill:#f7de8e;font-size:34px;font-weight:900}
      .subtitle{fill:#d8c8a7;font-size:17px;font-weight:800}
      .legend text{fill:#f8efdf;font-size:14px;font-weight:800}
    </style>
